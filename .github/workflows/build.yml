# Builds every app whose files changed, pushes ghcr.io/<owner>/<app>:<sha>,
# then commits the new tag into apps/<app>/app.yaml so Argo CD deploys it.
# Commits made with GITHUB_TOKEN don't retrigger workflows, so no loop.
name: build

on:
  push:
    branches: [main]
    paths: ["apps/**"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed apps
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            # First push or manual run: build everything.
            files=$(git ls-files apps)
          else
            files=$(git diff --name-only "$before" "$GITHUB_SHA" -- apps)
          fi
          # app.yaml-only changes are config, not code: no rebuild needed.
          apps=$(echo "$files" | grep -v '/app.yaml$' | cut -d/ -f2 | sort -u \
            | while read -r a; do [ -f "apps/$a/Dockerfile" ] && echo "$a"; done | xargs)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Apps to build: ${apps:-none}"

      - uses: docker/login-action@v3
        if: steps.changed.outputs.apps != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.changed.outputs.apps != ''
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${GITHUB_SHA::12}"
          for app in ${{ steps.changed.outputs.apps }}; do
            image="ghcr.io/$owner/$app:$tag"
            docker build -t "$image" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              "apps/$app"
            docker push "$image"
            yq -i ".image.tag = \"$tag\"" "apps/$app/app.yaml"
          done

      - name: Commit new tags
        if: steps.changed.outputs.apps != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${{ steps.changed.outputs.apps }} @ ${GITHUB_SHA::12}"
          git pull --rebase
          git push
