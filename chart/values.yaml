# Defaults for every app. Override any of these in apps/<name>/app.yaml.

image:
  # Defaults to registry.k3s.internal/<app name>, where deploy.sh pushes.
  repository: ""
  # Set by deploy.sh; don't edit by hand.
  tag: latest

# Port the container listens on.
port: 8080

replicas: 1

# Plain environment variables: { NAME: value }
env: {}

# Exposed at http://<host> on the internal network.
ingress:
  enabled: true
  # Defaults to <app name>.k3s.internal
  host: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 256Mi
